# Run by hand. Links Zano's own prebuilt libraries at a fixed commit, then runs a real sync with a throwaway key.
name: Zano native engine
on:
  workflow_dispatch:
    inputs:
      only:
        description: windows, android or all
        default: all
permissions:
  contents: read
env:
  ZANO_LIB_COMMIT: 08b38232c5
jobs:
  windows:
    if: ${{ inputs.only != 'android' }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Get the Zano library
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        run: |
          git lfs install
          git clone https://github.com/hyle-team/zano_native_lib zlib
          git -C zlib checkout $env:ZANO_LIB_COMMIT
          git -C zlib lfs pull --include "_install_windows/zano/x86_64/**,_install_windows/boost/x86_64/**,_install_windows/openssl/x86_64/**"
      - name: Build
        run: |
          cmake -S native/zano-bridge -B out -A x64 "-DZANO_NATIVE_LIB_PATH=$($PWD.Path)/zlib"
          cmake --build out --config Release -j 4
      - name: Bring along the Visual C++ runtime
        run: |
          mkdir pack
          copy out/Release/zano-bridge.exe pack/
          foreach ($d in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','concrt140.dll') { copy "$env:WINDIR/System32/$d" pack/ }
          dir pack
          Get-FileHash pack/* -Algorithm SHA256 | Format-Table Hash,Path -AutoSize | Out-String -Width 200
      - name: Real sync
        run: |
          pack/zano-bridge.exe --version
          mkdir z
          pack/zano-bridge.exe --selftest 37.27.100.59:10500 - "$($PWD.Path)/z" | Tee-Object -FilePath out.txt
          if (-not (Select-String -Path out.txt -Pattern "selftest ok")) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: zano-bridge-windows-x64
          path: pack
          retention-days: 30
  android:
    if: ${{ inputs.only != 'windows' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Get the Zano library
        run: |
          git lfs install
          GIT_LFS_SKIP_SMUDGE=1 git clone https://github.com/hyle-team/zano_native_lib zlib
          GIT_LFS_SKIP_SMUDGE=1 git -C zlib checkout "$ZANO_LIB_COMMIT"
          git -C zlib lfs pull --include "_install_android/arm64-v8a/**,_install_android/x86_64/**,_install_android/include/**,_libs_android/boost/arm64-v8a/**,_libs_android/boost/x86_64/**,_libs_android/openssl/arm64-v8a/**,_libs_android/openssl/x86_64/**,_libs_android/libbacktrace/arm64-v8a/**,_libs_android/libbacktrace/x86_64/**"
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
      - name: Build
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for abi in arm64-v8a x86_64; do
            cmake -S native/zano-bridge -B "out-$abi" -DCMAKE_BUILD_TYPE=Release \
              "-DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
              "-DCMAKE_EXE_LINKER_FLAGS=-s" "-DZANO_NATIVE_LIB_PATH=$PWD/zlib"
            cmake --build "out-$abi" -j4
            cp "out-$abi/zano-bridge" "$RUNNER_TEMP/bin/zano-bridge-$abi"
          done
          ls -la "$RUNNER_TEMP/bin"
          sha256sum "$RUNNER_TEMP/bin/"*
          rm -rf zlib out-*
      - uses: actions/upload-artifact@v4
        with:
          name: zano-bridge-android-arm64
          path: ${{ runner.temp }}/bin/zano-bridge-arm64-v8a
          retention-days: 30
      - name: Start Tor
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tor
          sudo systemctl stop tor || true
          tor --SocksPort 127.0.0.1:9150 --DataDirectory "$RUNNER_TEMP/tor" --RunAsDaemon 1
          for i in $(seq 1 60); do curl -s -m 10 --socks5-hostname 127.0.0.1:9150 https://check.torproject.org/api/ip | grep -q true && { echo Tor up; break; }; sleep 5; done
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real sync on an emulator
        timeout-minutes: 30
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb push "$RUNNER_TEMP/bin/zano-bridge-x86_64" /data/local/tmp/zano-bridge
            adb shell chmod 755 /data/local/tmp/zano-bridge
            adb shell /data/local/tmp/zano-bridge --version
            adb reverse tcp:9150 tcp:9150
            sleep 30
            adb shell "mkdir -p /data/local/tmp/z && HOME=/data/local/tmp/z /data/local/tmp/zano-bridge --selftest 37.27.100.59:10500 9150 /data/local/tmp/z" | tee "$RUNNER_TEMP/out.txt"
      - name: Verdict
        run: |
          cat "$RUNNER_TEMP/out.txt"
          grep -q "selftest ok" "$RUNNER_TEMP/out.txt"
