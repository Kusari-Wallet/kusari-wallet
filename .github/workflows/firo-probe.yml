# Run by hand. What the Firo explorer answers for a real address and a real transaction.
name: Firo probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          set +e
          for B in https://insight.firo.org/insight-api-zcoin https://explorer.firo.org/insight-api-zcoin; do
            echo "=== $B"
            H=$(curl -s -m 20 "$B/status?q=getLastBlockHash" | python3 -c "import json,sys;print(json.load(sys.stdin)['lastblockhash'])")
            echo "hash $H"
            BLOCK=$(curl -s -m 20 "$B/block/$H"); echo "block: ${BLOCK:0:300}"
            T=$(echo "$BLOCK" | python3 -c "import json,sys;print(json.load(sys.stdin)['tx'][0])")
            TX=$(curl -s -m 20 "$B/tx/$T"); echo "tx: ${TX:0:900}"
            A=$(echo "$TX" | python3 -c "import json,sys;print([a for v in json.load(sys.stdin)['vout'] for a in v.get('scriptPubKey',{}).get('addresses',[])][0])")
            echo "address $A"
            U=$(curl -s -m 30 "$B/addrs/$A/utxo"); echo "utxo: ${U:0:500}"
            X=$(curl -s -m 30 "$B/addrs/$A/txs?from=0&to=1&noAsm=1"); echo "txs: ${X:0:700}"
            F=$(curl -s -m 30 "$B/addrs/a1bW3sVVUsLqgKuTMXtSaAHGvpxKwugxPH/utxo"); echo "fresh: ${F:0:200}"
            S=$(curl -s -m 20 -w ' [%{http_code}]' -X POST -H 'content-type: application/json' -d '{"rawtx":"00"}' "$B/tx/send"); echo "send: ${S:0:200}"
            curl -s -m 20 -o /dev/null -w 'tx page %{http_code}\n' "https://explorer.firo.org/tx/$T"
          done
