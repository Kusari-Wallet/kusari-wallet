# Run by hand. Builds Kusari (a Monero fork) from Monero's pinned release, then starts a private chain from its
# genesis block, mines and sends coins between two wallets. The kusari-app-* artifacts unpack into native-bin/kusari,
# where the app's build picks up the wallet server.
name: Kusari coin
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Unit checks
        run: node --test tests/kusari-coin.test.js
      - name: Get Monero
        run: |
          TAG=$(node -p "require('./native/kusari-coin/params.json').monero.tag")
          git clone --depth 1 --branch "$TAG" --recurse-submodules --shallow-submodules https://github.com/monero-project/monero kusari
      - name: Make it Kusari
        run: node native/kusari-coin/prepare.js kusari
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libboost-all-dev libssl-dev libzmq3-dev \
            libunbound-dev libsodium-dev libunwind8-dev liblzma-dev libreadline-dev libexpat1-dev libhidapi-dev \
            libusb-1.0-0-dev libudev-dev
      - name: Build
        run: |
          cmake -S kusari -B kusari/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DUSE_DEVICE_TREZOR=OFF -DMANUAL_SUBMODULES=1
          cmake --build kusari/build --target daemon simplewallet wallet_rpc_server -j 4
          ls -la kusari/build/bin
      - name: Private chain
        timeout-minutes: 60
        run: node native/kusari-coin/selftest.js kusari/build/bin
      - name: The app's client against the real wallet server
        run: |
          npm ci --ignore-scripts --force
          npm run build
          KUSARI_BIN_DIR=kusari/build/bin node --test tests/kusari.test.js
      - name: Pack
        run: |
          mkdir pack
          cp kusari/build/bin/kusarid kusari/build/bin/kusari-wallet-cli kusari/build/bin/kusari-wallet-rpc pack/
          cp kusari/KUSARI_PARAMS.json pack/
          (cd pack && sha256sum * | tee SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: kusari-linux-x64
          path: pack
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: kusari-app-linux-x64
          path: kusari/build/bin/kusari-wallet-rpc
          retention-days: 30
  windows:
    # Monero's own Windows build: MSYS2 and its static release target. Not yet run.
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl mingw-w64-x86_64-zeromq mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-hidapi mingw-w64-x86_64-unbound mingw-w64-x86_64-nodejs
      - name: Get Monero and make it Kusari
        run: |
          TAG=$(node -p "require('./native/kusari-coin/params.json').monero.tag")
          git clone --depth 1 --branch "$TAG" --recurse-submodules --shallow-submodules https://github.com/monero-project/monero kusari
          node native/kusari-coin/prepare.js kusari
      - name: Build
        run: |
          cd kusari
          USE_SINGLE_BUILDDIR=1 make release-static-win64 -j 4
          ls -la build/release/bin
      - name: Pack
        run: |
          mkdir pack
          cp kusari/build/release/bin/kusarid.exe kusari/build/release/bin/kusari-wallet-cli.exe kusari/build/release/bin/kusari-wallet-rpc.exe pack/
          cp kusari/KUSARI_PARAMS.json pack/
          (cd pack && sha256sum * | tee SHA256SUMS)
      - name: It starts
        run: pack/kusari-wallet-rpc.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: kusari-windows-x64
          path: pack
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: kusari-app-windows-x64
          path: pack/kusari-wallet-rpc.exe
          retention-days: 30
