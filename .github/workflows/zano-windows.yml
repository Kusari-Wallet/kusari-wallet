# Run by hand: Windows minutes count double on private repositories.
name: Zano bridge for Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the Zano library at a fixed commit
        run: |
          git lfs install
          git clone https://github.com/hyle-team/zano_native_lib zlib
          git -C zlib checkout 08b38232c5
          git -C zlib lfs pull --include "_install_windows/**"
      - name: Build
        run: |
          cmake -S native/zano-bridge -B out -A x64 -DZANO_NATIVE_LIB_PATH=$PWD/zlib
          cmake --build out --config Release
      - name: It starts
        run: out/Release/zano-bridge.exe --version
      - name: Hash
        run: Get-FileHash out/Release/zano-bridge.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with: { name: zano-bridge-windows-x64, path: out/Release/zano-bridge.exe, retention-days: 30 }
